<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASM WebGL Визуализатор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Верхняя панель -->
    <header id="top-bar">
        <div class="logo">
            <span class="icon">🚀</span>
            <span class="title">WASM Visualizer</span>
        </div>
        
        <div class="file-controls">
            <div class="drop-area" id="drop-area">
                <span class="drop-icon">📁</span>
                <span class="drop-text">Перетащите файл или</span>
                <button class="btn-select" id="btn-select">Выбрать</button>
                <input type="file" id="file-input" multiple>
            </div>
            
            <div class="file-info" id="file-info">
                <span class="file-name" id="file-name">Нет файла</span>
                <span class="file-size" id="file-size"></span>
                <button class="btn-clear" id="btn-clear" title="Очистить">✕</button>
            </div>
        </div>
        
        <div class="status-bar">
            <span class="status-dot" id="status-dot"></span>
            <span class="status-text" id="status-text">Готов</span>
            <span class="fps-counter" id="fps-counter"></span>
        </div>
    </header>

    <!-- Основной контент -->
    <main>
        <div class="canvas-wrapper">
            <canvas id="glCanvas" width="2000" height="2000"></canvas>
            
            <!-- Оверлей для загрузки -->
            <div class="overlay" id="overlay">
                <div class="overlay-content">
                    <div class="spinner"></div>
                    <p id="overlay-text">Загрузка данных...</p>
                </div>
            </div>
            
            <!-- Информационная панель -->
            <div class="info-panel" id="info-panel">
                <div class="info-item">
                    <span class="info-label">Размер:</span>
                    <span class="info-value" id="info-size">0 байт</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Разрешение:</span>
                    <span class="info-value" id="info-resolution">2000×2000</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Тип:</span>
                    <span class="info-value" id="info-type">-</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Скрипты -->
    <script src="script.js"></script>
</body>
</html>
